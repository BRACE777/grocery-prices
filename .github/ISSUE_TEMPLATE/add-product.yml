name: Add a product
description: Track a new product on one of the lists. Picked up by the next price run.
title: "Add a product"
labels: ["add-product"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the product's web address from either shop. Open the product page
        at Woolworths or Coles, copy the address, and drop it in below.

        You only need one of the two. If a shop does not stock it, leave that
        box empty and the page will say so rather than guess.

  - type: dropdown
    id: profile
    attributes:
      label: Whose list?
      options:
        - Original
        - New Toby
        - Eunice
    validations:
      required: true

  - type: input
    id: woolworths
    attributes:
      label: Woolworths link
      placeholder: https://www.woolworths.com.au/shop/productdetails/623034/...

  - type: input
    id: coles
    attributes:
      label: Coles link
      placeholder: https://www.coles.com.au/product/...-2993706

  - type: dropdown
    id: category
    attributes:
      label: Which aisle?
      options:
        - Chips & savoury snacks
        - Drinks
        - Pantry & sauces
        - Mince
        - Chicken
        - Noodles
        - Frozen & dessert
    validations:
      required: true

  - type: dropdown
    id: basis
    attributes:
      label: Compare it how?
      description: >-
        Leave this alone unless you know better. Worked out from the pack size
        when left on Decide for me.
      options:
        - Decide for me
        - per 100g
        - per 100mL
        - per kilogram
        - per can
        - per pack
        - each
      default: 0

  - type: input
    id: title
    attributes:
      label: Call it what?
      description: Optional. The shop's own product name is used when left empty.

  - type: textarea
    id: note
    attributes:
      label: Anything worth noting
      description: >-
        Optional, shown under the row on the page. Good for things like
        "Coles only sells the 1.2kg pack".
